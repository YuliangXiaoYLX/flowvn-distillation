# Common labeled evaluation. The loader uses full depth/time in validation mode.
mode: validate
network: FlowVN
loss: supervised
features_in: 1
features_out: 24
kernel_size: 5
num_act_weights: 71
act: linear_flowvn
num_stages: 8
D_size: 5
T_size: 15
exp_loss: false
distill_enabled: false
teacher_initialize_student: false
val_split_json: data/splits/val.json
split_base_dir: data/TrainSet/Aorta
usrate: [10, 20, 30, 40, 50]
val_on_the_fly_mask: true
val_mask_seed: 12345
required_mask_backend: challenge
val_loss_only: false
val_sample_limit: -1
batch_size: 1
num_workers: 0
val_num_workers: 0
devices: [0]
precision_mode: fp32
allow_tf32: true
cudnn_benchmark: true
deterministic_algorithms: false
compile_model: false
compile_flowvn_activations: true
compile_flowvn_regularizer: true
compile_mode: default
flowvn_activation_lowmem: false
torchdynamo_disable_lru_cache: true
inference_empty_cache: true
test_log_images: false
use_wandb: false
ckpt_path: checkpoints/s8_full_seed12345.ckpt
save_dir: outputs/validation
