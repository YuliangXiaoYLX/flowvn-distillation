[project]
name = "flowvn-distillation"
version = "0.1.0"
description = "Stage-aligned knowledge distillation for 4D flow MRI reconstruction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.12.0",
    "pytorch-lightning==2.6.5",
    "numpy==2.2.6",
    "scipy==1.15.3; sys_platform == 'linux'",
    "scipy==1.18.0; sys_platform == 'darwin'",
    "pandas==2.3.3",
    "h5py==3.16.0",
    "hdf5storage==0.2.2",
    "einops==0.8.2",
    "scikit-image==0.25.2",
    "PyYAML==6.0.3",
    "tensorboard>=2.20,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
cpu = ["torch==2.12.0"]
cuda = ["torch==2.12.0; sys_platform == 'linux'"]
wandb = ["wandb==0.27.0"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.12'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
